<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal | SKY DJ & EVENT MANAGEMENT</title>
  <meta name="description" content="Client Sign In & Sign Up for SKY DJ & EVENT MANAGEMENT.">
  <link rel="icon" type="image/png" href="./images/logo.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 30%, #151824 0%, #050507 90%);
    }
    .auth-box {
      width: 100%;
      max-width: 460px;
      background: var(--black-card);
      border: 1px solid var(--black-border);
      border-radius: var(--r-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-heavy);
      position: relative;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--black-border);
      margin-bottom: 24px;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
      transition: color var(--t-fast);
    }
    .auth-tab-btn.active {
      color: var(--gold-bright);
    }
    .auth-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 2px;
      background: var(--gold-primary);
    }
    .google-divider {
      display: flex;
      align-items: center;
      margin: 24px 0 20px 0;
      color: var(--text-dim);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .google-divider::before, .google-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--black-border);
    }
    .google-divider span {
      padding: 0 12px;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #ffffff;
      color: #1a1a1a;
      border: none;
      border-radius: var(--r-md);
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      transition: all var(--t-fast) var(--ease-smooth);
    }
    .google-btn:hover {
      background: #f1f1f1;
      box-shadow: 0 4px 14px rgba(255,255,255,0.2);
    }
    .google-icon-svg {
      width: 20px;
      height: 20px;
    }
    .alert-msg {
      padding: 12px;
      border-radius: var(--r-sm);
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert-err {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    .alert-suc {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
    }
  </style>
</head>
<body>

<div class="auth-page-wrapper">
  <div class="auth-box">

    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html">
        <img src="./images/logo.png" alt="SKY DJ Logo" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--gold-primary); margin: 0 auto 12px auto; box-shadow: 0 0 16px var(--gold-glow);">
      </a>
      <h1 style="font-family: var(--font-display); font-size: 1.45rem; color: #fff; margin-bottom: 4px;">
        CLIENT PORTAL
      </h1>
      <p style="color: var(--text-muted); font-size: 0.85rem;">
        SKY DJ &amp; EVENT MANAGEMENT
      </p>
    </div>

    <!-- Alert Box -->
    <div id="authAlert" class="alert-msg"></div>

    <!-- Toggle Tabs: Sign In / Sign Up -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab-btn active" id="tabSignInBtn">SIGN IN</button>
      <button type="button" class="auth-tab-btn" id="tabSignUpBtn">SIGN UP</button>
    </div>

    <!-- ── SIGN IN FORM ── -->
    <form id="signInForm">
      <div class="admin-form-group">
        <label class="admin-form-label" for="signInEmail">Email *</label>
        <input type="email" id="signInEmail" name="email" class="admin-form-control" placeholder="name@example.com" required autocomplete="email">
      </div>

      <div class="admin-form-group">
        <label class="admin-form-label" for="signInPassword">Password *</label>
        <input type="password" id="signInPassword" name="password" class="admin-form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 10px; padding: 12px; font-weight: 700;">
        SIGN IN
      </button>

      <div style="text-align: right; margin-top: 12px;">
        <button type="button" id="forgotPasswordBtn" style="background: none; border: none; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; text-decoration: underline;">
          Forgot Password?
        </button>
      </div>
    </form>

    <!-- ── SIGN UP FORM ── -->
    <form id="signUpForm" style="display: none;">
      <div class="admin-form-group">
        <label class="admin-form-label" for="signUpName">Name *</label>
        <input type="text" id="signUpName" name="name" class="admin-form-control" placeholder="Your full name" required>
      </div>

      <div class="admin-form-group">
        <label class="admin-form-label" for="signUpUsername">Username (Optional)</label>
        <input type="text" id="signUpUsername" name="username" class="admin-form-control" placeholder="e.g. rahul99">
      </div>

      <div class="admin-form-group">
        <label class="admin-form-label" for="signUpEmail">Email *</label>
        <input type="email" id="signUpEmail" name="email" class="admin-form-control" placeholder="name@example.com" required autocomplete="email">
      </div>

      <div class="admin-form-group">
        <label class="admin-form-label" for="signUpPassword">Password *</label>
        <input type="password" id="signUpPassword" name="password" class="admin-form-control" placeholder="At least 6 characters" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 10px; padding: 12px; font-weight: 700;">
        SIGN UP
      </button>
    </form>

    <!-- ── OR CONTINUE WITH GOOGLE ── -->
    <div class="google-divider">
      <span>OR</span>
    </div>

    <button type="button" class="google-btn" id="clientGoogleBtn">
      <svg class="google-icon-svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Footer Links -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--black-border); font-size: 0.85rem;">
      <a href="login.html" style="color: var(--gold-primary);">
        ← Choose Role
      </a>
      <a href="index.html" style="color: var(--text-muted);">
        Return to Website
      </a>
    </div>

  </div>
</div>

<script type="module">
  import { 
    auth, 
    db, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    updateProfile,
    signInClientWithGoogle, 
    sendPasswordResetEmail,
    doc,
    setDoc,
    serverTimestamp,
    isFirebaseConfigured 
  } from "./js/firebase-config.js";

  const tabSignIn = document.getElementById("tabSignInBtn");
  const tabSignUp = document.getElementById("tabSignUpBtn");
  const formSignIn = document.getElementById("signInForm");
  const formSignUp = document.getElementById("signUpForm");
  const alertBox = document.getElementById("authAlert");
  const googleBtn = document.getElementById("clientGoogleBtn");
  const resetBtn = document.getElementById("forgotPasswordBtn");

  function showAlert(msg, isSuccess) {
    alertBox.textContent = msg;
    alertBox.className = `alert-msg ${isSuccess ? 'alert-suc' : 'alert-err'}`;
    alertBox.style.display = "block";
  }

  function clearAlert() {
    alertBox.style.display = "none";
  }

  // Toggle Tab handling
  tabSignIn.addEventListener("click", () => {
    tabSignIn.classList.add("active");
    tabSignUp.classList.remove("active");
    formSignIn.style.display = "block";
    formSignUp.style.display = "none";
    clearAlert();
  });

  tabSignUp.addEventListener("click", () => {
    tabSignUp.classList.add("active");
    tabSignIn.classList.remove("active");
    formSignUp.style.display = "block";
    formSignIn.style.display = "none";
    clearAlert();
  });

  function getRedirect() {
    const params = new URLSearchParams(window.location.search);
    return params.get("redirect") || "index.html";
  }

  // 1. Client Sign In
  formSignIn.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearAlert();

    if (!isFirebaseConfigured() || !auth) {
      showAlert("Firebase credentials need to be configured in js/firebase-config.js.", false);
      return;
    }

    const email = formSignIn.email.value.trim();
    const password = formSignIn.password.value;
    const btn = formSignIn.querySelector("button[type='submit']");

    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
      await signInWithEmailAndPassword(auth, email, password);
      showAlert("Sign-in successful! Redirecting...", true);
      setTimeout(() => {
        window.location.href = getRedirect();
      }, 900);
    } catch (err) {
      console.error("Sign-in error:", err);
      let msg = "Invalid email or password.";
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
        msg = "Invalid email or password. Please verify your credentials.";
      } else {
        msg = err.message;
      }
      showAlert(msg, false);
    } finally {
      btn.disabled = false;
      btn.textContent = "SIGN IN";
    }
  });

  // 2. Client Sign Up
  formSignUp.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearAlert();

    if (!isFirebaseConfigured() || !auth) {
      showAlert("Firebase credentials need to be configured in js/firebase-config.js.", false);
      return;
    }

    const name = formSignUp.name.value.trim();
    const username = formSignUp.username.value.trim();
    const email = formSignUp.email.value.trim();
    const password = formSignUp.password.value;
    const btn = formSignUp.querySelector("button[type='submit']");

    if (!name || !email || !password) {
      showAlert("Please enter all required fields.", false);
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      
      // Update display name
      await updateProfile(cred.user, { displayName: name });

      // Save client profile in Firestore users/{userId}
      if (db) {
        await setDoc(doc(db, "users", cred.user.uid), {
          name,
          username: username || "",
          email,
          role: "client",
          createdAt: serverTimestamp()
        });
      }

      showAlert("Account created successfully! Redirecting...", true);
      setTimeout(() => {
        window.location.href = getRedirect();
      }, 1000);

    } catch (err) {
      console.error("Sign-up error:", err);
      let msg = err.message;
      if (err.code === "auth/email-already-in-use") {
        msg = "An account with this email already exists. Please sign in instead.";
      } else if (err.code === "auth/weak-password") {
        msg = "Password should be at least 6 characters.";
      }
      showAlert(msg, false);
    } finally {
      btn.disabled = false;
      btn.textContent = "SIGN UP";
    }
  });

  // 3. Continue with Google
  googleBtn.addEventListener("click", async () => {
    clearAlert();

    if (!isFirebaseConfigured() || !auth) {
      showAlert("Firebase credentials need to be configured in js/firebase-config.js.", false);
      return;
    }

    googleBtn.disabled = true;
    googleBtn.innerHTML = "Signing in with Google...";

    try {
      const user = await signInClientWithGoogle();
      showAlert(`Welcome, ${user.displayName || user.email}! Redirecting...`, true);
      setTimeout(() => {
        window.location.href = getRedirect();
      }, 1000);
    } catch (err) {
      console.error("Google sign-in error:", err);
      showAlert(err.message || "Failed to sign in with Google.", false);
    } finally {
      googleBtn.disabled = false;
      googleBtn.innerHTML = `
        <svg class="google-icon-svg" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      `;
    }
  });

  // 4. Password Reset
  resetBtn.addEventListener("click", async () => {
    const email = formSignIn.email.value.trim();
    if (!email) {
      alert("Please enter your email address in the Email field above first.");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      alert(`Password reset link sent to ${email}`);
    } catch (err) {
      alert("Could not send password reset: " + err.message);
    }
  });
</script>

</body>
</html>
